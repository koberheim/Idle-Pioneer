<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idle Pioneer</title>
<meta name="description" content="Idle Pioneer: found colonies and build trade routes across colonial North America. An idle game for Android and iOS.">
<style>
  :root {
    --bg: #f4ead5; --paper: #fbf4e4; --ink: #2e2418; --muted: #6b5a44;
    --accent: #8a3b12; --rule: #d9c7a3;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1712; --paper: #25201a; --ink: #eadfca; --muted: #b3a38a; --accent: #e0925a; --rule: #4a3f31; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 32rem; margin: 2rem 1rem; padding: 2rem 1.5rem; text-align: center;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
  }
  h1 { font-family: "Libre Baskerville", Georgia, "Times New Roman", serif; font-size: 2.2rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-block; padding: .6rem 1.2rem; border: 1px solid var(--accent); border-radius: 4px;
    color: var(--accent); text-decoration: none; font-weight: 600;
  }
  a:hover, a:focus { background: var(--accent); color: var(--paper); }
  footer { margin-top: 1.5rem; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Idle Pioneer</h1>
<p>Found colonies, send out expeditions and grow a trading empire across colonial North America, even while you're away.</p>
<ul>
<li><a href="support.html">Support</a></li>
<li><a href="privacy.html">Privacy Policy</a></li>
</ul>
<footer>&copy; {{DEVELOPER_NAME}}</footer>
</main>
</body>
</html>
